# Rede do Pulsar: um Worker da Cloudflare (plano grátis) com um Durable Object que guarda tudo.
# O deploy é feito pelo GitHub Actions (.github/workflows/rede.yml) com os segredos
# CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.
name = "pulsar-rede"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "REDE"
class_name = "Rede"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Rede"]
