<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'">
  <title>Console do Pulsar</title>
  <link rel="stylesheet" href="console.css">
</head>
<body>
  <!-- Barra de título própria (os botões de minimizar, maximizar e fechar são os do Windows, por cima). -->
  <div class="titlebar">
    <img src="logo.png" alt="" width="20" height="20">
    <span>Console do Pulsar</span>
  </div>
  <header>
    <div class="brand">
      <span class="emblem"><img src="logo.png" alt="" width="40" height="40"></span>
      <i id="live" class="live" title="Jogo aberto"></i>
      <b>Console do Pulsar</b>
    </div>
    <span class="sep"></span>
    <span id="count" class="count">0 linhas</span>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input id="filter" type="search" placeholder="Filtrar (ex.: erro, Pulsar, CHAT)" autocomplete="off">
    </label>
    <div class="tools">
      <label class="check"><input id="onlyErr" type="checkbox"><span></span> só erros</label>
      <label class="check"><input id="follow" type="checkbox" checked><span></span> rolar sozinho</label>
      <span class="sep"></span>
      <button type="button" id="copy">Copiar tudo</button>
      <button type="button" id="clear">Limpar</button>
    </div>
  </header>
  <main id="log" aria-live="off"></main>
  <script src="i18n.js"></script>
  <script src="console.js"></script>
</body>
</html>
