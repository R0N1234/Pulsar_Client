name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            17
      - name: Compilar o mod 1.8.9
        working-directory: mod
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          for u in https://repo.essential.gg/repository/maven-public/gg/essential/architectury-loom/maven-metadata.xml https://repo.essential.gg/repository/maven-releases/gg/essential/architectury-loom/maven-metadata.xml https://repo.essential.gg/public/gg/essential/architectury-loom/maven-metadata.xml https://repo.essential.gg/repository/maven-public/gg/essential/loom/gg.essential.loom.gradle.plugin/maven-metadata.xml; do echo "== $u" >> /tmp/probe.log; curl -sSL "$u" 2>&1 | grep -oE "<version>[^<]+</version>|<latest>[^<]+</latest>|HTTP|404|Not Found" | tail -15 >> /tmp/probe.log; done
          if ! ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log; then
            # Publica o log no branch ci-log para facilitar o diagnóstico
            cp build.log /tmp/build.log
            cd "$GITHUB_WORKSPACE"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git checkout --orphan ci-log
            git rm -rfq --cached .
            cat /tmp/probe.log /tmp/build.log > build.log
            git add build.log
            git commit -qm "Log do build ${GITHUB_SHA}"
            git push -f origin ci-log
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pulsar-mod
          path: mod/build/libs/pulsar-client-*.jar

  launcher-windows:
    needs: mod
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: pulsar-mod
          path: mod/build/libs
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Gerar o instalador do Windows
        working-directory: launcher
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: pulsar-launcher-windows
          path: launcher/dist/*.exe
