name: Build

on:
  push:
  pull_request:

jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            17
      - name: Compilar o mod 1.8.9
        working-directory: mod
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log; then
            msg=$( { grep -A12 "What went wrong" build.log; grep -E "error:" build.log | head -20; grep -m6 "Caused by" build.log; } | head -45 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Falha ao compilar o mod::${msg}"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pulsar-mod
          path: mod/build/libs/pulsar-client-*.jar

  launcher-windows:
    needs: mod
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: pulsar-mod
          path: mod/build/libs
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Gerar o instalador do Windows
        working-directory: launcher
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: pulsar-launcher-windows
          path: launcher/dist/*.exe
