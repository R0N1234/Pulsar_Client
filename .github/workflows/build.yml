name: Build

on:
  push:
  pull_request:

jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            17
      - name: Compilar o mod 1.8.9
        working-directory: mod
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pulsar-mod
          path: mod/build/libs/pulsar-client-*.jar

  launcher-windows:
    needs: mod
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: pulsar-mod
          path: mod/build/libs
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Gerar o instalador do Windows
        working-directory: launcher
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: pulsar-launcher-windows
          path: launcher/dist/*.exe
