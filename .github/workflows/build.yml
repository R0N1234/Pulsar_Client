name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            21
      - name: Compilar o mod 1.8.9
        working-directory: mod
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log; then
            # Publica o log no branch ci-log para facilitar o diagnóstico
            cp build.log /tmp/build.log
            cd "$GITHUB_WORKSPACE"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git checkout --orphan ci-log
            git rm -rfq --cached .
            cp /tmp/build.log build.log
            git add build.log
            git commit -qm "Log do build ${GITHUB_SHA}"
            git push -f origin ci-log
            exit 1
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: pulsar-mod
          path: mod/build/libs/pulsar-client-*.jar
      - name: Assinaturas da API do Minecraft para consulta (ramo ci-api)
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/api
          find ~/.gradle "$GITHUB_WORKSPACE/mod/.gradle" -name "*.jar" 2>/dev/null | grep -v sources > /tmp/api/jars.txt || true
          CP=$(grep -iE "minecraft|forge" /tmp/api/jars.txt | paste -sd: -)
          for c in $(cat mod/api-classes.txt 2>/dev/null); do
            echo "=== $c" >> /tmp/api/api.txt
            javap -p -classpath "$CP" "$c" >> /tmp/api/api.txt 2>&1 || true
          done
          find ~/.gradle "$GITHUB_WORKSPACE/mod/.gradle" \( -name "*.tiny" -o -name "*.srg" -o -name "*.tsrg" \) 2>/dev/null > /tmp/api/mappings.txt || true
          for f in $(cat /tmp/api/mappings.txt); do
            grep -E "$(paste -sd'|' mod/api-names.txt 2>/dev/null || echo NADA)" "$f" | head -400 | sed "s|^|$(basename $f): |" >> /tmp/api/nomes.txt || true
          done
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan ci-api
          git rm -rfq --cached .
          cp /tmp/api/*.txt .
          cp "$(grep -m1 'mappings-srg-named.srg' /tmp/api/mappings.txt)" srg-nomes.srg 2>/dev/null || true
          git add api.txt jars.txt mappings.txt nomes.txt srg-nomes.srg 2>/dev/null || git add jars.txt
          git commit -qm "API ${GITHUB_SHA}"
          git push -qf origin ci-api || true

  e2e:
    needs: mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: pulsar-mod
          path: mod/build/libs
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalar tela virtual
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb x11-xserver-utils libgl1-mesa-dri imagemagick
      - name: Abrir o Minecraft 1.8.9 com o Pulsar
        working-directory: launcher
        shell: bash
        env:
          E2E_PRINTS: ${{ runner.temp }}/prints
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          status=0
          xvfb-run -a -s "-screen 0 1280x720x24" node test/e2e.js "$RUNNER_TEMP/e2e" || status=$?
          # Publica o log e os prints das telas do Pulsar no ramo ci-log, para conferir o visual.
          mkdir -p /tmp/ci-log
          cp "$RUNNER_TEMP/e2e/e2e.log" /tmp/ci-log/build.log || echo "sem log" > /tmp/ci-log/build.log
          cp "$E2E_PRINTS"/*.png /tmp/ci-log/ 2>/dev/null || true
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan ci-log
          git rm -rfq --cached .
          cp /tmp/ci-log/* .
          git add build.log *.png 2>/dev/null || git add build.log
          git commit -qm "Log e prints do e2e ${GITHUB_SHA}"
          git push -qf origin ci-log || true
          exit $status

  launcher-windows:
    needs: mod
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: pulsar-mod
          path: mod/build/libs
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Gerar o instalador do Windows
        working-directory: launcher
        run: |
          npm install
          npm run dist
      - name: Conferir se nada ficou fora do instalador
        working-directory: launcher
        run: node test/pacote.js
      - name: Gerar o instalador com a tela do Pulsar
        working-directory: launcher
        run: node ../instalador/compilar.js instalador
      - name: Testar no Windows (instalar, abrir o launcher e atualizar)
        shell: pwsh
        timeout-minutes: 20
        run: |
          $prints = Join-Path $env:RUNNER_TEMP "prints-windows"
          New-Item -ItemType Directory -Force -Path $prints | Out-Null
          $log = Join-Path $prints "windows.log"
          $inst = (Get-ChildItem launcher/dist/Pulsar-Client-Instalador-*.exe | Select-Object -First 1).FullName
          $setup = (Get-ChildItem "launcher/dist/Pulsar Client Setup *.exe" | Select-Object -First 1).FullName
          $falhas = @()
          function Anotar($texto) { $texto | Tee-Object -FilePath $log -Append }

          # 1. Telas do instalador e do atualizador
          $p = Start-Process -FilePath $inst -ArgumentList "--prints", $prints -Wait -PassThru
          Anotar "prints do instalador: código $($p.ExitCode)"

          # 2. Instalação de verdade, sem cliques
          $t = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath $inst -ArgumentList "--auto", "--sem-abrir" -Wait -PassThru
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Pulsar Client\Pulsar Client.exe"
          Anotar "instalação: código $($p.ExitCode) em $([int]$t.Elapsed.TotalSeconds) s; launcher em $exe existe: $(Test-Path $exe)"
          if ($p.ExitCode -ne 0 -or -not (Test-Path $exe)) { $falhas += "instalação" }

          if (Test-Path $exe) {
            $atualizador = Join-Path (Split-Path $exe) "resources\atualizador\PulsarAtualizador.exe"
            Anotar "atualizador junto do launcher: $(Test-Path $atualizador)"
            if (-not (Test-Path $atualizador)) { $falhas += "atualizador fora do launcher" }

            # 3. Launcher instalado: print de cada aba, baixando e ligando uma textura
            $env:PULSAR_PRINTS = $prints
            $p = Start-Process -FilePath $exe -Wait -PassThru -RedirectStandardOutput (Join-Path $prints "launcher.log") -RedirectStandardError (Join-Path $prints "launcher-erros.log")
            Remove-Item Env:PULSAR_PRINTS
            Anotar "launcher: código $($p.ExitCode)"
            foreach ($aba in "inicio", "mods", "seus-mods", "texturas", "texturas-usando", "ajustes", "atualizacao") {
              if (-not (Test-Path (Join-Path $prints "launcher-$aba.png"))) { $falhas += "print $aba" }
            }

            # 4. Atualização pela tela do Pulsar (o launcher copia o atualizador para a pasta temporária antes)
            if (Test-Path $atualizador) {
              $copia = Join-Path $env:TEMP "PulsarAtualizador-teste.exe"
              Copy-Item $atualizador $copia
              $t = [Diagnostics.Stopwatch]::StartNew()
              $p = Start-Process -FilePath $copia -ArgumentList "--atualizar", "`"$setup`"", "--versao", "teste", "--app", "`"$exe`"", "--auto", "--sem-abrir" -Wait -PassThru
              Anotar "atualização: código $($p.ExitCode) em $([int]$t.Elapsed.TotalSeconds) s; launcher existe: $(Test-Path $exe)"
              if ($p.ExitCode -ne 0 -or -not (Test-Path $exe)) { $falhas += "atualização" }
            }
          }
          Get-Content (Join-Path $env:TEMP "PulsarClient-instalador.log") -ErrorAction SilentlyContinue | Add-Content $log
          if ($falhas.Count -gt 0) { Write-Error ("Falhou no Windows: " + ($falhas -join ", ")); exit 1 }
      - name: Publicar prints do Windows (ramo ci-windows)
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ci-windows
          cp "$RUNNER_TEMP"/prints-windows/* /tmp/ci-windows/ 2>/dev/null || echo "sem prints" > /tmp/ci-windows/windows.log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan ci-windows
          git rm -rfq --cached .
          cp /tmp/ci-windows/* .
          git add *.png *.log 2>/dev/null || git add windows.log
          git commit -qm "Prints do Windows ${GITHUB_SHA}"
          git push -qf origin ci-windows || true
      - uses: actions/upload-artifact@v5
        with:
          name: pulsar-launcher-windows
          path: |
            launcher/dist/Pulsar-Client-Instalador-*.exe
            launcher/dist/Pulsar Client Setup *.exe
