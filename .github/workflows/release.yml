name: Lançar versão

# Aba Ações > "Lançar versão" > Run workflow, digite a versão nova (maior que a atual).
# Gera o instalador e publica nos Releases deste repositório; os launchers com a chave de atualização baixam sozinhos.
on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão nova (ex.: 0.3.0)"
        required: true
      notas:
        description: "O que mudou (aparece na página da versão)"
        required: false

permissions:
  contents: write

jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            21
      - name: Compilar o mod 1.8.9
        working-directory: mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Versão anterior do mod (aba Versões do launcher)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ inputs.versao }}
        run: .github/scripts/anterior.sh "$VERSAO"
      # O jar passa para o outro job pelo cache (a cota de artefatos do GitHub enche fácil com os instaladores).
      - run: mkdir -p mod/build/anterior
      - uses: actions/cache/save@v4
        with:
          path: |
            mod/build/libs
            mod/build/anterior
          key: pulsar-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true

  publicar:
    needs: mod
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: |
            mod/build/libs
            mod/build/anterior
          key: pulsar-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Gerar e publicar o instalador
        working-directory: launcher
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSAO: ${{ inputs.versao }}
          NOTAS: ${{ inputs.notas }}
        run: |
          npm install --no-audit --no-fund
          npm version "$VERSAO" --no-git-tag-version --allow-same-version
          # A tela de atualização vai junto com o launcher; o instalador com a tela do Pulsar sai depois.
          node ../instalador/compilar.js atualizador
          npx electron-builder --win --x64 --publish always -c.releaseInfo.releaseNotes="${NOTAS:-Versão $VERSAO}"
          node ../instalador/compilar.js instalador
          gh release upload "v$VERSAO" "dist/Pulsar-Client-Instalador-$VERSAO.exe" --clobber
          # O jar do mod vai junto: a próxima versão usa ele na aba Versões (versão anterior).
          for f in ../mod/build/libs/pulsar-client-*.jar; do case "$f" in *-sources.jar|*-dev.jar) ;; *) gh release upload "v$VERSAO" "$f" --clobber ;; esac; done
