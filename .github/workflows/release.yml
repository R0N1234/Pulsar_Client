name: Lançar versão

# Aba Ações > "Lançar versão" > Run workflow, digite a versão nova (maior que a atual).
# Gera o instalador e publica no repositório de versões; os launchers abertos atualizam sozinhos.
on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão nova (ex.: 0.3.0)"
        required: true
      notas:
        description: "O que mudou (aparece na página da versão)"
        required: false

permissions:
  contents: read

jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            21
      - name: Compilar o mod 1.8.9
        working-directory: mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: pulsar-mod
          path: mod/build/libs/pulsar-client-*.jar

  publicar:
    needs: mod
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: pulsar-mod
          path: mod/build/libs
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Gerar e publicar o instalador
        working-directory: launcher
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSAO: ${{ inputs.versao }}
          NOTAS: ${{ inputs.notas }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Falta o segredo RELEASES_TOKEN (veja o README, seção Atualizações)."
            exit 1
          fi
          npm install --no-audit --no-fund
          npm version "$VERSAO" --no-git-tag-version --allow-same-version
          npx electron-builder --win --x64 --publish always -c.releaseInfo.releaseNotes="${NOTAS:-Versão $VERSAO}"
